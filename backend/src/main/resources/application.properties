spring.application.name=clubverse-backend

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- Database ---
# Default to H2 in-memory database with PostgreSQL compatibility mode for
# local development without requiring a PostgreSQL install. Override via
# DB_URL, DB_USERNAME, DB_PASSWORD to use a real PostgreSQL database.
spring.datasource.url=${DB_URL:jdbc:h2:mem:clubverse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable SQL initialization to prevent MySQL schema from being loaded
# when using H2 database for development
spring.sql.init.mode=never

# H2 console for debugging (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT ---
# Falls back to a dev-only default so `mvn spring-boot:run` still works out of
# the box, but ALWAYS set JWT_SECRET in any real deployment.
app.jwt.secret=${JWT_SECRET:ClubverseSecretKeyForJwtAuthentication2026VerySecure}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
# Comma-separated list of origins allowed to call this API. Defaults cover
# the Vite dev server (default port 5173, but Vite auto-increments if busy)
# and the Vite preview server.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}

# Spring MVC CORS configuration
spring.mvc.cors.allowed-origins=http://localhost:5173
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=Authorization,Content-Type,X-Requested-With
spring.mvc.cors.allow-credentials=false

# --- Event file uploads ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}