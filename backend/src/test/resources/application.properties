spring.application.name=clubverse-backend

# --- Test database ---
# Tests run against an in-memory H2 database (PostgreSQL compatibility mode)
# so they don't depend on a local PostgreSQL install or its credentials.
spring.datasource.url=jdbc:h2:mem:clubverse_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# src/main/resources/data.sql is MySQL syntax for the demo database; never
# run it against the test schema.
spring.sql.init.mode=never

# --- JWT ---
app.jwt.secret=TestOnlyJwtSecretKeyForClubverseAutomatedTests2026
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:5173
